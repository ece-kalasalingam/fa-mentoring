<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="900" viewBox="0 0 1200 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="mainGrad" x1="310" y1="720" x2="880" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0057FF"/>
      <stop offset="0.42" stop-color="#19D6D7"/>
      <stop offset="0.72" stop-color="#4E8BFF"/>
      <stop offset="1" stop-color="#B446FF"/>
    </linearGradient>

    <linearGradient id="capGrad" x1="410" y1="160" x2="690" y2="310" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0577E6"/>
      <stop offset="0.48" stop-color="#3C7DFF"/>
      <stop offset="1" stop-color="#B94AFF"/>
    </linearGradient>

    <linearGradient id="barGrad" x1="350" y1="770" x2="780" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0057FF"/>
      <stop offset="0.5" stop-color="#15D3D8"/>
      <stop offset="1" stop-color="#9642FF"/>
    </linearGradient>

    <linearGradient id="arrowSide" x1="650" y1="700" x2="940" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#126BFF"/>
      <stop offset="0.55" stop-color="#23D5DF"/>
      <stop offset="1" stop-color="#A948FF"/>
    </linearGradient>

    <filter id="glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feColorMatrix in="blur" type="matrix"
        values="0 0 0 0 0.05
                0 0 0 0 0.62
                0 0 0 0 1
                0 0 0 0.72 0"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="10" flood-color="#001A66" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- transparent background; logo only -->

  <g filter="url(#glow)">
    <!-- rear shadow extrusion -->
    <path d="M283 683V623C283 575 303 530 337 496L467 366C498 335 549 334 583 363L672 441C685 453 705 452 717 439L833 320L755 279L999 216L937 461L890 415L732 577C693 618 628 620 585 583L509 518C496 507 476 508 465 520L377 608V716C377 740 358 760 334 760H328C303 760 283 740 283 716V683Z"
          fill="#073BB5" opacity="0.55"/>

    <!-- bars -->
    <path d="M300 730V617C300 593 320 573 344 573H381C405 573 425 593 425 617V730C425 754 405 774 381 774H344C320 774 300 754 300 730Z"
          fill="url(#barGrad)" filter="url(#softShadow)"/>
    <path d="M477 730V547C477 523 497 503 521 503H558C582 503 602 523 602 547V730C602 754 582 774 558 774H521C497 774 477 754 477 730Z"
          fill="url(#barGrad)" filter="url(#softShadow)"/>
    <path d="M654 730V425C654 401 674 381 698 381H735C759 381 779 401 779 425V730C779 754 759 774 735 774H698C674 774 654 754 654 730Z"
          fill="url(#arrowSide)" filter="url(#softShadow)"/>

    <!-- main rising arrow path -->
    <path d="M283 645V585C283 535 302 490 337 455L456 336C492 300 548 300 586 333L675 413C688 424 707 424 720 411L823 307L748 268L993 207L931 450L887 408L745 550C704 591 637 594 594 556L518 489C504 477 483 478 470 491L283 679V645Z"
          fill="url(#mainGrad)" filter="url(#softShadow)"/>

    <!-- bright top highlight of arrow path -->
    <path d="M325 590L482 433C504 411 538 410 561 431L646 508C681 539 735 537 768 504L887 385"
          stroke="#8DFFF5" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" opacity="0.66"/>

    <!-- arrow head -->
    <path d="M748 268L993 207L931 450L871 335L748 268Z"
          fill="url(#mainGrad)" filter="url(#softShadow)"/>
    <path d="M800 294L952 238L912 393L872 333L800 294Z"
          fill="#FFFFFF" opacity="0.16"/>

    <!-- graduation cap top -->
    <path d="M390 195L550 132L715 195L550 277L390 195Z"
          fill="url(#capGrad)" filter="url(#softShadow)"/>

    <!-- cap lower body -->
    <path d="M432 251L550 310L668 251V347C640 387 602 415 550 428C498 415 460 387 432 347V251Z"
          fill="url(#capGrad)" filter="url(#softShadow)"/>

    <!-- cap inner white/blue fold -->
    <path d="M455 256L550 303L646 256V300C604 323 576 350 550 385C523 350 497 323 455 300V256Z"
          fill="#EAFBFF" opacity="0.75"/>
    <path d="M455 300C497 323 523 350 550 385C576 350 604 323 646 300V347C613 363 585 386 550 428C515 386 488 363 455 347V300Z"
          fill="#0057FF" opacity="0.28"/>

    <!-- tassel -->
    <path d="M419 207C399 235 398 260 398 292" stroke="#056BD7" stroke-width="16" stroke-linecap="round"/>
    <circle cx="398" cy="315" r="20" fill="#0878E4"/>
    <path d="M398 335L376 382L398 411L421 382L398 335Z" fill="#086CE0"/>

    <!-- subtle outlines -->
    <path d="M390 195L550 132L715 195L550 277L390 195Z" stroke="#123CBA" stroke-opacity="0.45" stroke-width="2"/>
    <path d="M283 645V585C283 535 302 490 337 455L456 336C492 300 548 300 586 333L675 413C688 424 707 424 720 411L823 307L748 268L993 207L931 450L887 408L745 550C704 591 637 594 594 556L518 489C504 477 483 478 470 491L283 679V645Z"
          stroke="#1537B8" stroke-opacity="0.35" stroke-width="2"/>
  </g>
</svg>
